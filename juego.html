<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego</title>
    <script src="js/Pruebajuego.js"></script>
</head>
<body>
    <main>
        <h1>Piedra, papel o tijera</h1>
        <p class="instrucciones">Elige una opción contra la máquina</p>

        <div class="opciones">
            <button type="button" onclick="juego('piedra')">Piedra</button>
            <button type="button" onclick="juego('papel')">Papel</button>
            <button type="button" onclick="juego('tijera')">Tijera</button>
        </div>
        <p id="marcador">Partidas jugadas: 0</p>
        <p id="ganadas">Ganadas: 0</p>
        <p id="empatadas">Empates: 0</p>
        <p id="perdidas">Derrotas: 0</p>

        <section id="resultado">
            <h2>Resultado</h2>
            <p id="jugada-jugador">Tu jugada aparecerá aquí.</p>
            <p id="jugada-maquina">La jugada de la máquina aparecerá aquí.</p>
            <p id="mensaje"></p>
        </section>
    </main>
</body>
</html>
