<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El primer script</title>
    <script src="../js/codigo.js"></script>
    <style>
      * {
        background-color: #1e293b;
        color: white
      }

      .btn-js {
        background-color: #1e293b;
        color: #38bdf8;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #334155;
        font-family: Arial, Helvetica;
        font-weight: normal;
        font-size: 0.9rem;

          background-color 0.2s,
          transform 0.1s;

      .btn-volver {

        top: 20px;
        right: 20px;
        background-color: #1e293b;
        color: #38bdf8;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #334155;
        font-family: Arial, Helvetica;
        font-weight: normal;
        font-size: 0.9rem;
        transition:
          background-color 0.2s,
          transform 0.1s;
      }

      .btn-volver:hover {
        background-color: #334155;
        transform: translateX(-3px);
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="btn-volver">←</a>
    <p><strong>Esta página contiene el primer script</strong></p>
